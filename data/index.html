<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pump WiFi settings</title>
    <link rel="stylesheet" type="text/css" href="css/all.css"/>
    <script>
        function showSaveError(message) {
            clearSaveSuccess();
            var el = document.getElementById("saveError");
            var text = (message && String(message).trim()) ? String(message).trim() : "Save failed";
            if (el) {
                el.textContent = text;
                el.hidden = false;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
            alert(text);
        }

        function clearSaveError() {
            var el = document.getElementById("saveError");
            if (el) {
                el.textContent = "";
                el.hidden = true;
            }
        }

        function showSaveSuccess(message) {
            clearSaveError();
            var el = document.getElementById("saveSuccess");
            var text = (message && String(message).trim())
                ? String(message).trim()
                : "Settings saved successfully";
            if (el) {
                el.textContent = text;
                el.hidden = false;
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        function clearSaveSuccess() {
            var el = document.getElementById("saveSuccess");
            if (el) {
                el.textContent = "";
                el.hidden = true;
            }
        }

        function isSaveOk(response, text) {
            if (!(response.ok || response.status === 200)) {
                return false;
            }
            return String(text || "").trim() === "OK";
        }

        function saveSystemSettings() {
            clearSaveError();
            clearSaveSuccess();
            var wiFiSsId = document.getElementById("wiFiSSID").value;
            var wiFiPassword = document.getElementById("wiFiPassword").value;
            var networkEnableOta = document.getElementById("networkEnableOta").checked ? "1" : "0";
            var networkWifiEnabled = document.getElementById("networkWifiEnabled").checked ? "1" : "0";
            var mqttEnabled = document.getElementById("mqttEnabled").checked ? "1" : "0";
            var mqttServer = document.getElementById("mqttServer").value;
            var mqttPort = document.getElementById("mqttPort").value;
            var mqttDeviceName = document.getElementById("mqttDeviceName").value;
            var mqttReconnectIntervalMs = document.getElementById("mqttReconnectIntervalMs").value;
            var mqttTopicTheDeviceIsAlive = document.getElementById("mqttTopicTheDeviceIsAlive").value;
            var mqttTopicThePumpState = document.getElementById("mqttTopicThePumpState").value;
            var mqttTopicPressureValue = document.getElementById("mqttTopicPressureValue").value;
            var mqttTopicToListenCommands = document.getElementById("mqttTopicToListenCommands").value;
            var mqttTopicToListenServerWasBorn = document.getElementById("mqttTopicToListenServerWasBorn").value;
            var mqttTopicIsTheDeviceEnabled = document.getElementById("mqttTopicIsTheDeviceEnabled").value;
            var mqttPressureUpdateDiffAtm = document.getElementById("mqttPressureUpdateDiffAtm").value;
            var mqttPressurePubMinIntSec = document.getElementById("mqttPressurePubMinIntSec").value;
            var mqttPumpStatePubMinIntSec = document.getElementById("mqttPumpStatePubMinIntSec").value;
            var pressureMinAtm = document.getElementById("pressureMin").value;
            var pressureMaxAtm = document.getElementById("pressureMax").value;
            var pressureLeakEnabled = document.getElementById("pressureLeakEnabled").checked ? "1" : "0";
            var pressureLeak = document.getElementById("pressureLeak").value;
            var pressureWeak = document.getElementById("pressureWeak").value;
            var pressureSensorMaxAtm = document.getElementById("pressureSensorMax").value;
            var pressureSensorMinVolts = document.getElementById("pressureSensorMinVolts").value;
            var pressureSensorMaxVolts = document.getElementById("pressureSensorMaxVolts").value;
            var pressureSamplesCount = document.getElementById("pressureSamplesCount").value;
            var pressureMeasureIntervalMs = document.getElementById("pressureMeasureIntervalMs").value;
            var pressureMeasurementsCount = document.getElementById("pressureMeasurementsCount").value;
            var displayRotate180 = document.getElementById("displayRotate180").checked ? "1" : "0";

            var saveNetworkSettings = function () {
                fetch("/settingsApi", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "operation=write&parameter=wifi&network>ssid=" + encodeURIComponent(wiFiSsId)
                        + "&network>password=" + encodeURIComponent(wiFiPassword)
                        + "&network>enableOtaOnNetwork=" + networkEnableOta
                        + "&network>wifiEnabled=" + networkWifiEnabled
                }).then(function (response) {
                    return response.text().then(function (text) {
                        if (!isSaveOk(response, text)) {
                            throw new Error(text || response.statusText || ("HTTP " + response.status));
                        }
                        showSaveSuccess("Settings saved successfully");
                    });
                }).catch(function (error) {
                    // Device may restart after WiFi save; treat a dropped connection as success.
                    var msg = (error && error.message) ? String(error.message) : String(error);
                    if (/failed to fetch|networkerror|load failed/i.test(msg)) {
                        showSaveSuccess("Settings saved successfully");
                        return;
                    }
                    showSaveError(msg);
                });
            };

            var mqttBody = "operation=write&parameter=mqtt>mqttEnabled=" + mqttEnabled
                + "|mqtt>server=" + mqttServer
                + "|mqtt>port=" + mqttPort
                + "|mqtt>deviceName=" + mqttDeviceName
                + "|mqtt>reconnectIntervalMs=" + mqttReconnectIntervalMs
                + "|mqtt>topicTheDeviceIsAlive=" + mqttTopicTheDeviceIsAlive
                + "|mqtt>topicThePumpState=" + mqttTopicThePumpState
                + "|mqtt>topicPressureValue=" + mqttTopicPressureValue
                + "|mqtt>topicToListenCommands=" + mqttTopicToListenCommands
                + "|mqtt>topicToListenServerWasBorn=" + mqttTopicToListenServerWasBorn
                + "|mqtt>topicIsTheDeviceEnabled=" + mqttTopicIsTheDeviceEnabled
                + "|mqtt>pressureUpdateDiffAtm=" + mqttPressureUpdateDiffAtm
                + "|mqtt>pressurePubMinIntSec=" + mqttPressurePubMinIntSec
                + "|mqtt>pumpStatePubMinIntSec=" + mqttPumpStatePubMinIntSec
                + "|pressure>minAtm=" + pressureMinAtm
                + "|pressure>maxAtm=" + pressureMaxAtm
                + "|pressure>leakDetectEnabled=" + pressureLeakEnabled
                + "|pressure>leakDetectSec=" + pressureLeak
                + "|pressure>pumpWeakSec=" + pressureWeak
                + "|pressure>sensorMaxAtm=" + pressureSensorMaxAtm
                + "|pressure>sensorMinVolts=" + pressureSensorMinVolts
                + "|pressure>sensorMaxVolts=" + pressureSensorMaxVolts
                + "|pressure>samplesCount=" + pressureSamplesCount
                + "|pressure>measureIntervalMs=" + pressureMeasureIntervalMs
                + "|pressure>measurementsCount=" + pressureMeasurementsCount
                + "|display>rotate180=" + displayRotate180;

            fetch("/settingsApi", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: mqttBody
            }).then(function (response) {
                return response.text().then(function (text) {
                    if (!isSaveOk(response, text)) {
                        throw new Error(text || response.statusText || ("HTTP " + response.status));
                    }
                    saveNetworkSettings();
                });
            }).catch(function (error) {
                showSaveError((error && error.message) ? error.message : String(error));
            });
        }

        function initFormControls() {
            var ota = document.getElementById("networkEnableOta");
            if (ota) {
                ota.checked = ota.getAttribute("data-value") === "1";
            }
            var wifiEnabled = document.getElementById("networkWifiEnabled");
            if (wifiEnabled) {
                wifiEnabled.checked = wifiEnabled.getAttribute("data-value") === "1";
            }
            var leakEnabled = document.getElementById("pressureLeakEnabled");
            if (leakEnabled) {
                leakEnabled.checked = leakEnabled.getAttribute("data-value") === "1";
            }
            var rotate180 = document.getElementById("displayRotate180");
            if (rotate180) {
                rotate180.checked = rotate180.getAttribute("data-value") === "1";
            }
            var mqttEnabled = document.getElementById("mqttEnabled");
            if (mqttEnabled) {
                mqttEnabled.checked = mqttEnabled.getAttribute("data-value") === "1";
            }
        }

        function initTabs() {
            var buttons = document.querySelectorAll(".tab-btn");
            var panels = document.querySelectorAll(".tab-panel");
            var storageKey = "settingsActiveTab";
            var sensorVoltageTimer = null;
            var sensorVoltageField = document.getElementById("pressureSensorCurrentVolts");

            function fetchSensorVoltage() {
                if (!sensorVoltageField) {
                    return;
                }
                fetch("/sensorVoltage")
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error("bad status");
                        }
                        return response.text();
                    })
                    .then(function (text) {
                        sensorVoltageField.value = text.trim();
                    })
                    .catch(function () { /* ignore transient errors */ });
            }

            function setSensorVoltagePolling(enabled) {
                if (sensorVoltageTimer !== null) {
                    clearInterval(sensorVoltageTimer);
                    sensorVoltageTimer = null;
                }
                if (enabled) {
                    fetchSensorVoltage();
                    sensorVoltageTimer = setInterval(fetchSensorVoltage, 1000);
                }
            }

            function showTab(name) {
                buttons.forEach(function (btn) {
                    btn.classList.toggle("active", btn.getAttribute("data-tab") === name);
                });
                panels.forEach(function (panel) {
                    panel.classList.toggle("active", panel.id === "tab-" + name);
                });
                try {
                    sessionStorage.setItem(storageKey, name);
                } catch (e) { /* ignore */ }
                setSensorVoltagePolling(name === "sensor");
            }

            buttons.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    showTab(btn.getAttribute("data-tab"));
                });
            });

            var initial = "wifi";
            try {
                var saved = sessionStorage.getItem(storageKey);
                if (saved && document.getElementById("tab-" + saved)) {
                    initial = saved;
                }
            } catch (e) { /* ignore */ }
            showTab(initial);
        }

        function initPasswordToggle() {
            var input = document.getElementById("wiFiPassword");
            var toggle = document.getElementById("wiFiPasswordToggle");
            if (!input || !toggle) {
                return;
            }
            toggle.addEventListener("click", function () {
                var showing = input.type === "text";
                input.type = showing ? "password" : "text";
                toggle.textContent = showing ? "Show" : "Hide";
                toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            initFormControls();
            initTabs();
            initPasswordToggle();
        });
    </script>
</head>
<body>
<div class="page">
    <h1 class="page-title">Pump settings</h1>
    <div id="saveError" class="save-error" role="alert" hidden></div>
    <div id="saveSuccess" class="save-success" role="status" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Settings groups">
        <button type="button" class="tab-btn active" data-tab="wifi" role="tab">WiFi</button>
        <button type="button" class="tab-btn" data-tab="display" role="tab">Display</button>
        <button type="button" class="tab-btn" data-tab="mqtt" role="tab">MQTT</button>
        <button type="button" class="tab-btn" data-tab="pressure" role="tab">Pressure</button>
        <button type="button" class="tab-btn" data-tab="sensor" role="tab">Sensor settings</button>
    </nav>

    <div id="tab-wifi" class="tab-panel active" role="tabpanel">
        <div class="field">
            <label for="wiFiSSID">WiFi SSID</label>
            <input id="wiFiSSID" type="text" autocomplete="off" value="%network>ssid%">
        </div>

        <div class="field">
            <label for="wiFiPassword">WiFi password</label>
            <div class="password-row">
                <input id="wiFiPassword" type="password" autocomplete="off" value="%network>password%">
                <button type="button" id="wiFiPasswordToggle" class="password-toggle" aria-label="Show password">Show</button>
            </div>
        </div>

        <div class="field field-check">
            <input id="networkWifiEnabled" type="checkbox" data-value="%network>wifiEnabled%">
            <label for="networkWifiEnabled">Wi‑Fi enabled (STA)</label>
        </div>

        <div class="field field-check">
            <input id="networkEnableOta" type="checkbox" data-value="%network>enableOtaOnNetwork%">
            <label for="networkEnableOta">Enable OTA updates over Wi‑Fi</label>
        </div>
    </div>

    <div id="tab-display" class="tab-panel" role="tabpanel">
        <div class="field field-check">
            <input id="displayRotate180" type="checkbox" data-value="%display>rotate180%">
            <label for="displayRotate180">Rotate screen 180&deg;</label>
        </div>
    </div>

    <div id="tab-mqtt" class="tab-panel" role="tabpanel">
        <div class="field field-check">
            <input id="mqttEnabled" type="checkbox" data-value="%mqtt>mqttEnabled%">
            <label for="mqttEnabled">MQTT enabled</label>
        </div>

        <div class="field">
            <label for="mqttServer">MQTT server</label>
            <input id="mqttServer" type="text" autocomplete="off" value="%mqtt>server%">
        </div>

        <div class="field">
            <label for="mqttPort">MQTT port</label>
            <input id="mqttPort" type="number" inputmode="numeric" value="%mqtt>port%">
        </div>

        <div class="field">
            <label for="mqttDeviceName">Unique device name</label>
            <input id="mqttDeviceName" type="text" autocomplete="off" value="%mqtt>deviceName%">
        </div>

        <div class="field">
            <label for="mqttReconnectIntervalMs">Reconnect interval (ms)</label>
            <input id="mqttReconnectIntervalMs" type="number" inputmode="numeric" value="%mqtt>reconnectIntervalMs%">
        </div>

        <div class="field">
            <label for="mqttTopicTheDeviceIsAlive">Alive topic</label>
            <p class="field-hint">Topic used to report that the device is alive</p>
            <input id="mqttTopicTheDeviceIsAlive" type="text" autocomplete="off" value="%mqtt>topicTheDeviceIsAlive%">
        </div>

        <div class="field">
            <label for="mqttTopicThePumpState">Pump state topic</label>
            <p class="field-hint">Topic used to report the pump state</p>
            <input id="mqttTopicThePumpState" type="text" autocomplete="off" value="%mqtt>topicThePumpState%">
        </div>

        <div class="field">
            <label for="mqttTopicIsTheDeviceEnabled">Enabled topic</label>
            <p class="field-hint">Topic used to report that the device is enabled</p>
            <input id="mqttTopicIsTheDeviceEnabled" type="text" autocomplete="off" value="%mqtt>topicIsTheDeviceEnabled%">
        </div>

        <div class="field">
            <label for="mqttTopicPressureValue">Pressure topic</label>
            <p class="field-hint">Topic used to report the pressure value</p>
            <input id="mqttTopicPressureValue" type="text" autocomplete="off" value="%mqtt>topicPressureValue%">
        </div>

        <div class="field">
            <label for="mqttTopicToListenCommands">Commands topic</label>
            <p class="field-hint">Topic used to listen for commands</p>
            <input id="mqttTopicToListenCommands" type="text" autocomplete="off" value="%mqtt>topicToListenCommands%">
        </div>

        <div class="field">
            <label for="mqttTopicToListenServerWasBorn">Server restart topic</label>
            <p class="field-hint">Topic used when the server has restarted</p>
            <input id="mqttTopicToListenServerWasBorn" type="text" autocomplete="off" value="%mqtt>topicToListenServerWasBorn%">
        </div>

        <div class="field">
            <label for="mqttPressureUpdateDiffAtm">Update pressure difference (Atm)</label>
            <input id="mqttPressureUpdateDiffAtm" type="number"
                   min="0.01" max="0.5" step="0.01" value="%mqtt>pressureUpdateDiffAtm%">
        </div>

        <div class="field">
            <label for="mqttPressurePubMinIntSec">Pressure publish min interval (sec)</label>
            <input id="mqttPressurePubMinIntSec" type="number"
                   min="5" max="120" step="1" value="%mqtt>pressurePubMinIntSec%">
        </div>

        <div class="field">
            <label for="mqttPumpStatePubMinIntSec">Pump state publish min interval (sec)</label>
            <input id="mqttPumpStatePubMinIntSec" type="number"
                   min="5" max="120" step="1" value="%mqtt>pumpStatePubMinIntSec%">
        </div>
    </div>

    <div id="tab-pressure" class="tab-panel" role="tabpanel">
        <div class="field">
            <label for="pressureMin">Min pressure (Atm)</label>
            <input id="pressureMin" type="number" step="0.01"
                   min="%pressure>minAtm#min%" max="%pressure>minAtm#max%" value="%pressure>minAtm%">
        </div>

        <div class="field">
            <label for="pressureMax">Max pressure (Atm)</label>
            <input id="pressureMax" type="number" step="0.01"
                   min="%pressure>maxAtm#min%" max="%pressure>maxAtm#max%" value="%pressure>maxAtm%">
        </div>

        <div class="field field-check">
            <input id="pressureLeakEnabled" type="checkbox" data-value="%pressure>leakDetectEnabled%">
            <label for="pressureLeakEnabled">Leak detection enabled</label>
        </div>

        <div class="field">
            <label for="pressureLeak">Leak timeout (s)</label>
            <input id="pressureLeak" type="number" step="1"
                   min="%pressure>leakDetectSec#min%" max="%pressure>leakDetectSec#max%"
                   value="%pressure>leakDetectSec%">
        </div>

        <div class="field">
            <label for="pressureWeak">Weak pump timeout (s)</label>
            <input id="pressureWeak" type="number" step="1"
                   min="%pressure>pumpWeakSec#min%" max="%pressure>pumpWeakSec#max%"
                   value="%pressure>pumpWeakSec%">
        </div>
    </div>

    <div id="tab-sensor" class="tab-panel" role="tabpanel">
        <div class="field">
            <label for="pressureSensorMax">Sensor full-scale (Atm)</label>
            <input id="pressureSensorMax" type="number" step="0.1"
                   min="%pressure>sensorMaxAtm#min%" max="%pressure>sensorMaxAtm#max%"
                   value="%pressure>sensorMaxAtm%">
        </div>

        <div class="field">
            <label for="pressureSensorMinVolts">Sensor min (V)</label>
            <input id="pressureSensorMinVolts" type="number" step="0.005"
                   min="%pressure>sensorMinVolts#min%" max="%pressure>sensorMinVolts#max%"
                   value="%pressure>sensorMinVolts%">
        </div>

        <div class="field">
            <label for="pressureSensorMaxVolts">Sensor max (V)</label>
            <input id="pressureSensorMaxVolts" type="number" step="0.005"
                   min="%pressure>sensorMaxVolts#min%" max="%pressure>sensorMaxVolts#max%"
                   value="%pressure>sensorMaxVolts%">
        </div>

        <div class="field">
            <label for="pressureSamplesCount">Samples count</label>
            <input id="pressureSamplesCount" type="number" step="1"
                   min="%pressure>samplesCount#min%" max="%pressure>samplesCount#max%"
                   value="%pressure>samplesCount%">
        </div>

        <div class="field">
            <label for="pressureMeasureIntervalMs">Measure interval (ms)</label>
            <input id="pressureMeasureIntervalMs" type="number" step="1"
                   min="%pressure>measureIntervalMs#min%" max="%pressure>measureIntervalMs#max%"
                   value="%pressure>measureIntervalMs%">
        </div>

        <div class="field">
            <label for="pressureMeasurementsCount">Measurements count</label>
            <input id="pressureMeasurementsCount" type="number" step="1"
                   min="%pressure>measurementsCount#min%" max="%pressure>measurementsCount#max%"
                   value="%pressure>measurementsCount%">
        </div>

        <div class="field">
            <label for="pressureSensorCurrentVolts">Current (V)</label>
            <input id="pressureSensorCurrentVolts" type="text" readonly value="—">
        </div>
    </div>
</div>

<div class="page-footer">
    <div class="page-footer-inner">
        <button type="button" class="btn btn-primary" onclick="saveSystemSettings()">Save</button>
        <button type="button" class="btn btn-secondary" onclick="window.location='/'">Reload</button>
    </div>
</div>
</body>
</html>
